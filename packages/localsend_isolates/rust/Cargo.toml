[package]
name = "rust_lib_localsend_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[features]
# Forwarded from the `localsend` core crate. Keeping the alias locally means
# `#[cfg(feature = "fs")]` on the FRB wrappers matches the feature that
# `localsend` is actually built with.
#
# `fs` is in `default` so the isolates build that cargokit hands
# to Flutter on iOS / macOS / Windows actually compiles the
# /api/localsend/v2/fs/* dispatcher. Without it, `#[cfg(feature =
# "fs")]` branches in server.rs (the fs_config / start_with_port
# wiring) are erased and every fs endpoint silently 404s.
default = ["fs"]
fs = ["localsend/fs"]

[dependencies]
anyhow = "1.0"
bytes = "1.12"
flutter_rust_bridge = { version = "=2.13.0", features = ["uuid"] }
futures-util = "0.3"
localsend = { path = "../../core", features = ["full"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22" }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
