LocalSend 现有的架构是 Dart/Flutter + 内置轻量 HTTP 服务（基于 shelf 框架）+ 局域网 UDP 组播/mDNS 广播。如果要将其改造为“挂载端提供文件管理服务、移动端进行远程 CRUD 浏览”的系统，整体架构改造可以分为以下几个关键步骤：
一、 整体架构设计（双端职责）
⚬	挂载端（Windows / Mac，作为 Server/Host）：
⚬	保留：原本的局域网 mDNS/UDP 多播广播能力（让手机自动发现电脑节点）。
⚬	新增：
⚬	挂载点抽象层：枚举 Windows 盘符（C:, D:, E:）或 macOS 挂载目录（/Volumes/*）。
⚬	文件管理 REST/WebDAV 服务：扩展内置的 shelf 路由，处理手机发来的增删改查请求。
⚬	安全与白名单沙盒：避免暴露整个系统敏感文件，需支持用户指定“仅共享某个磁盘或特定目录”。
⚬	手机端（iOS / Android，作为 Client/Explorer）：
⚬	保留：设备扫描与安全配对逻辑（PIN 码或指纹认证）。
⚬	新增：
⚬	远程文件浏览器 UI：面包屑路径导航、文件网格/列表视图、排序筛选。
⚬	CRUD 操作流：
⚬	Create：新建远程文件夹，或直接将手机相册/文件流式上传到远程当前路径。
⚬	Read：流式下载文件、图片缩略图懒加载、音视频分段播放（HTTP Range）。
⚬	Update：远程文件重命名、跨目录移动（服务端直接 rename，不消耗网络带宽）。
⚬	Delete：批量删除远端文件/目录（支持配置是否移入系统回收站）。
二、 服务端（挂载端）核心改造方案
LocalSend 的桌面端本身就运行着一个基于 Dart shelf 的 HTTP Server，因此无需引入第三方笨重服务，直接在现有 Dart 代码中扩充路由即可：
1. 协议选型：自定义 JSON REST API vs 内嵌 WebDAV
建议采用 轻量自定义 RESTful API（若想完全自研 UI），或者 内嵌 WebDAV 路由：
⚬	自定义 REST API（开发成本最低，与 LocalSend 现有代码风格最契合）：
⚬	GET /api/localsend/v2/fs/roots：获取所有可用磁盘（Windows 遍历 D:\、E:\，Mac 遍历 /Volumes）。
⚬	GET /api/localsend/v2/fs/list?path=锛氳幏鍙栫洰褰曚笅鐨勬枃浠跺垪琛紙鍚嶇О銆佸ぇ灏忋€佹渶鍚庝慨鏀规椂闂淬€丮IME 绫诲瀷銆佹槸鍚︿负鐩綍锛夈€�
⚬	POST /api/localsend/v2/fs/mkdir：新建文件夹。
⚬	POST /api/localsend/v2/fs/move：重命名或移动路径（入参：from_path, to_path）。
⚬	POST /api/localsend/v2/fs/delete：删除指定文件/目录。
⚬	GET /api/localsend/v2/fs/download?path=锛氭祦寮忎笅杞斤紝蹇呴』甯︿笂 Accept-Ranges: bytes銆�
⚬	POST /api/localsend/v2/fs/upload：Multi-part 或 Stream 方式接收来自手机的写入请求。
2. 安全边界与路径穿越防御（核心难点）
开放文件系统操作必须严格防范安全风险：
⚬	绝对路径校验：在 Dart 中处理传入路径时，务必使用 Directory(path).resolveSymbolicLinksSync() 计算真实绝对路径，杜绝通过 ../../ 访问到根目录以外的文件。
⚬	白名单限定：在桌面端设置页增加“允许访问的存储设备”勾选框。默认仅允许访问外接驱动器或指定的个人目录。
三、 手机端（Client）前端交互与实现关键
1. 设备发现与入口
⚬	在局域网扫描列表（原本选择接收方的列表）中，点击设备除了原本的“发送文件”，增加一个 “浏览驱动器” 图标。
⚬	点击进入后，自动请求 GET /fs/roots，呈现：
⚬	[本地磁盘 (C:)]、[工作盘 (D:)]、[移动固态硬盘 (E:)]。
2. 大目录渲染与媒体体验
⚬	无限滚动与分页：手机访问包含成千上万张相片的移动硬盘时，不能一次性返回全量数据，按 50~100 个/页分页。
⚬	缩略图服务：若手机端直接拉取数码相机动辄 20MB 的 RAW/JPG 原图，页面会严重卡顿。服务端可以新增一个 GET /fs/thumbnail 接口，利用轻量图像处理库在服务端生成 128x128 缩略图后返回。
⚬	媒体分段串流：音频和视频播放需依赖 HTTP 206 Partial Content，手机端调用播放器（如 video_player / just_audio）可以直接拖动进度条，边下边播。
四、 快速落地的工程实施路径（分阶段）
	1.	Phase 1：打通只读浏览与下载（MVP）
⚬	在桌面端 Dart 代码中注入 2 个接口：list 和 download。
⚬	手机端新增一个基础的 ListView 页面，验证网络连通性、跨目录跳转和点击下载到本地。
	2.	Phase 2：补齐写入能力（上传与新建目录）
⚬	增加 mkdir 与 upload 接口，支持手机“分享到”或相册多选后，直接写入指定移动硬盘的当前路径。
	3.	Phase 3：移动、重命名与删除（完整 CRUD）
⚬	增加文件长按菜单，支持重命名、跨目录移动与删除操作。
	4.	Phase 4：系统挂载发现自动化
⚬	桌面端监听 USB 热插拔事件（Windows 监听 WM_DEVICECHANGE，Mac 监听 NSWorkspaceDidMountNotification），当插入移动硬盘时，手机端无需手动刷新即可实时看到新盘符。
这种改造方式完全继承了 LocalSend “无中心节点、端到端局域网直连、不限速、UI 清爽” 的优良基因，能把手机和电脑之间的临时互传真正升级为个人局域网随身云盘。